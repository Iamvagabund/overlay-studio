<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор оверлеїв: налаштуйте безкоштовний оверлей для OBS | Overlay Studio</title>
<meta name="description" content="Налаштуйте безкоштовний анімований оверлей для OBS з живим прев'ю і скопіюйте готове посилання для Browser Source.">
<meta name="root" content="../">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css?v=20260925135414">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="./"><i></i>Overlay Studio</a>
  <nav><a href="./#free">Усі оверлеї</a><a class="lang" id="langlink" href="../editor.html" hreflang="en">EN</a><a class="btn primary" href="./#pro">PRO-набори</a></nav>
</div></header>

<main class="wrap editor">
  <div class="panel">
    <div class="picker" id="picker"></div>
    <h1 id="wname"></h1>
    <p class="lead" id="wblurb"></p>
    <p class="note" id="wnote" hidden></p>
    <form id="form" onsubmit="return false"></form>
  </div>

  <div class="stage">
    <div class="screen" id="screen"><iframe id="frame" title="Прев'ю оверлею"></iframe></div>
    <p class="demo-note" id="demo-note" data-ui="demoNote" hidden></p>
    <div class="out panel">
      <div class="url"><input id="url" readonly aria-label="Посилання на оверлей"><button class="btn primary" id="copy" data-ui="copy"></button><button class="btn ghost" id="save" data-ui="save"></button></div>
      <div class="obs">
        <b data-ui="addObs"></b>
        <ol>
          <li>Sources → <code>+</code> → <code>Browser</code></li>
          <li>Вставте посилання в поле <code>URL</code></li>
          <li>Width <code id="ow"></code>, Height <code id="oh"></code> → OK</li>
        </ol>
      </div>
    </div>
    <div class="panel mine">
      <h2 data-ui="myOverlays"></h2>
      <p class="muted" id="saved-empty" data-ui="noneSaved"></p>
      <ul class="saved" id="saved"></ul>
      <label for="paste" data-ui="editLink"></label>
      <div class="url"><input id="paste" data-ui-ph="pastePh"><button class="btn ghost" id="paste-go" data-ui="open"></button></div>
    </div>
    <div class="ad-slot">Реклама</div>
  </div>
</main>

<script src="../assets/i18n.js?v=20260925135414"></script>
<script src="../assets/widgets.js?v=20260925135414"></script>
<script src="../assets/links.js?v=20260925135414"></script>
<script src="../assets/editor.js?v=20260925135414"></script>
</body>
</html>
