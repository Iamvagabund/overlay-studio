<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goal Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* Settings via URL:
     ?title=Sub%20goal  &current=12  &target=50  &prefix=$  &suffix=subs
     &style=sleek|neon|pixel  &accent=%238b5cf6  &preview=1 */
  :root { --accent: #8b5cf6; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.preview { background: linear-gradient(135deg, #1e293b, #0f172a 60%, #312e81); }
  .goal { position: absolute; left: 30px; right: 30px; top: 50%; transform: translateY(-50%); color: #fff; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 20px; }
  .title { font-weight: 700; font-size: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nums { font-size: 26px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { position: relative; height: 38px; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; transition: width 1.8s cubic-bezier(.2, .9, .2, 1); }
  .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, #ffffff66 50%, transparent 80%); background-size: 200% 100%; animation: shine 2.4s linear infinite; }
  .pct { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 18px; z-index: 2; text-shadow: 0 1px 4px #000a; }
  @keyframes shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .done .title::after { content: " ✓"; }
  .done .track { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* SLEEK — rounded glass bar with gradient fill */
  .s-sleek { font-family: "Space Grotesk", sans-serif; }
  .s-sleek .track { border-radius: 999px; background: #ffffff1a; border: 1px solid #ffffff33; backdrop-filter: blur(8px); }
  .s-sleek .fill { border-radius: 999px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #22d3ee)); box-shadow: 0 0 24px var(--accent); }
  .s-sleek .title, .s-sleek .nums { text-shadow: 0 2px 8px #000a; }

  /* NEON — outlined tube with glowing fill */
  .s-neon { font-family: Orbitron, sans-serif; }
  .s-neon .title { text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 12px var(--accent); }
  .s-neon .track { border: 2px solid var(--accent); border-radius: 10px; background: #05010acc; box-shadow: 0 0 18px var(--accent), inset 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent); padding: 4px; }
  .s-neon .fill { margin: 4px; border-radius: 6px; background: var(--accent); box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent); }

  /* PIXEL — chunky 8-bit segments */
  .s-pixel { font-family: "Press Start 2P", monospace; }
  .s-pixel .title { font-size: 20px; color: #ffd23f; text-shadow: 3px 3px 0 #000; }
  .s-pixel .nums { font-size: 16px; text-shadow: 3px 3px 0 #000; }
  .s-pixel .track { background: #000; border: 6px solid #fff; box-shadow: 6px 6px 0 #000; height: 44px; }
  .s-pixel .fill { background: repeating-linear-gradient(90deg, var(--accent) 0 22px, transparent 22px 26px); transition-timing-function: steps(12); }
  .s-pixel .fill::after { display: none; }
  .s-pixel .pct { font-size: 12px; }
</style>
</head>
<body>
<div class="goal" id="goal">
  <div class="head"><div class="title" id="title"></div><div class="nums" id="nums"></div></div>
  <div class="track"><div class="fill" id="fill"></div><div class="pct" id="pct"></div></div>
</div>
<canvas id="confetti"></canvas>
<script src="lib.js"></script>
<script>
  OL.initPreview(); OL.initAccent();
  const style = OL.pick("style", ["sleek", "neon", "pixel"]);
  document.body.classList.add("s-" + style);

  const current = OL.num("current", 0), target = Math.max(1, OL.num("target", 100));
  const prefix = OL.str("prefix"), suffix = OL.str("suffix");
  const pct = Math.min(100, Math.max(0, (current / target) * 100));
  const fmt = n => prefix + n.toLocaleString("en-US") + (suffix ? " " + suffix : "");

  document.getElementById("title").textContent = OL.str("title", "Goal");
  document.getElementById("nums").textContent = `${fmt(current)} / ${fmt(target)}`;
  document.getElementById("pct").textContent = Math.floor(pct) + "%";
  // start at 0 so the fill animates in when OBS loads the source
  requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById("fill").style.width = pct + "%"; }));

  if (pct >= 100) {
    document.getElementById("goal").classList.add("done");
    setTimeout(confetti, 1600);
  }

  function confetti() {
    const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ["#ff4d6d", "#ffd23f", "#3ddc97", "#4d96ff", "#c77dff", getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()];
    const bits = Array.from({ length: 160 }, () => ({
      x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * 22, vy: -Math.random() * 18 - 4,
      r: Math.random() * 6 + 3, a: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)],
    }));
    let frames = 0;
    (function loop() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (const b of bits) {
        b.vy += .45; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.a += .2;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); ctx.restore();
      }
      if (++frames < 220) requestAnimationFrame(loop); else ctx.clearRect(0, 0, cv.width, cv.height);
    })();
  }
</script>
</body>
</html>
